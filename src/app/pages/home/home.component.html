<main class="main">
  <div class="content">
    <h1>{{ title }}</h1>
    <div style="display: flex; justify-content: center; gap: 20px; padding: 20px;">
      <mat-card class="home-card">
        <mat-card-title>Explore Activities</mat-card-title>
        <img mat-card-image src="assets/bowl.jpg" alt="Activities image">
        <mat-card-content>
          Discover exciting things to do in your area.
        </mat-card-content>
        <mat-card-actions>
          <button mat-raised-button routerLink="/activity">View Activities</button>
        </mat-card-actions>
      </mat-card>

      <mat-card class="home-card">
        <mat-card-title>Upcoming Events</mat-card-title>
        <img mat-card-image src="assets/drummer.jpg" alt="Events image">
        <mat-card-content>
          Find out about local events.
        </mat-card-content>
        <mat-card-actions>
          <button mat-raised-button routerLink="/event">View Events</button>
        </mat-card-actions>
      </mat-card>

      <mat-card class="home-card">
        <mat-card-title>Your Profile</mat-card-title>
        <img mat-card-image src="assets/profile.jpg" alt="Profile image">
        <mat-card-content>
          Manage your saved activities.
        </mat-card-content>
        <mat-card-actions>
          <button mat-raised-button (click)="navigateToProfile()">Go to Profile</button>
        </mat-card-actions>
      </mat-card>
    </div>

  </div>
</main>
