<div class="content">
  <h1>Welcome to the Activities Page</h1>
  <p>Explore local attractions and points of interest.</p> <section>

  <div *ngFor="let place of places" class="attraction-card">
    <a [routerLink]="['/activity', place.place_id]" class="card-link">

      <h3>{{ place.name }}</h3>
      <p>{{ place.vicinity }}</p>
      <p *ngIf="place.rating">Rating: {{ place.rating }} / 5</p>

      <img *ngIf="place.imageUrl"
           [src]="place.imageUrl"
           alt="Photo of {{ place.name }}"
           width="300"
           (error)="onImageError($event)">

      <div *ngIf="!place.imageUrl">
        <p><i>(No photo available)</i></p>
      </div>
    </a>
  </div>
