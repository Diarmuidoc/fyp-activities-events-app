<div class="content">
  <h2>Upcoming Events in {{ locationCity }}</h2>

  <div *ngIf="isLoading">
    <p>Loading events...</p>
  </div>

  <div *ngIf="error">
    <p style="color: red;">{{ error }}</p>
  </div>

  <div *ngIf="!isLoading && !error">
    <p *ngIf="events.length === 0">No upcoming events found for this location.</p>

    <div class="event-list" *ngIf="events.length > 0">
      <mat-card *ngFor="let event of events" class="event-card">
        <mat-card-header>
          <mat-card-title>{{ event.name }}</mat-card-title>
          <mat-card-subtitle>
            {{ getVenueName(event) }} | {{ getEventDate(event) }} at {{ getEventTime(event) }}
          </mat-card-subtitle>
        </mat-card-header>
        <img mat-card-image [src]="getEventImageUrl(event)" [alt]="event.name">
        <mat-card-content>
        </mat-card-content>
        <mat-card-actions>
          <a mat-button [href]="event.url" target="_blank" rel="noopener noreferrer">View on Ticketmaster</a>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
